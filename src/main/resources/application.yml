spring:
  application:
    name: Linked Store

  datasource:
    url: jdbc:postgresql://localhost:5432/linked_store
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
      file-size-threshold: 2MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
        order_updates: true
        order_inserts: true
        batch:
          versioned_data: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    property-naming-strategy: SNAKE_CASE

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@vicinity24.com}}
    properties:
      mail:
        transport:
          protocol: smtps
        smtp:
          auth: true
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
            required: false
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}
            trust: ${MAIL_SMTP_SSL_TRUST:}
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000

  scheduling:
    pool:
      size: 4

stripe:
  api-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  public-key: ${STRIPE_PUBLIC_KEY:pk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  platform-fee-percent: 0
  connect:
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  subscription:
    plus-price-id: ${SUBSCRIPTION_PLUS_STRIPE_PRICE_ID:}
    pro-price-id: ${SUBSCRIPTION_PRO_STRIPE_PRICE_ID:}

cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket-name: ${R2_BUCKET_NAME:share}
    endpoint: ${R2_ENDPOINT:}
    public-url: ${R2_PUBLIC_URL:}
    image-max-bytes: 20971520

inventory:
  lock-minutes: 15
  expiry-scheduler-seconds: 30

management:
  endpoints:
    enabled-by-default: false
  endpoint:
    health:
      enabled: false
  health:
    defaults:
      enabled: false
  info:
    defaults:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: false
  prometheus:
    metrics:
      export:
        enabled: false

server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /

seed:
  catalog: false

platform:
  root:
    admin: ${LINKEDSTORE_PLATFORM_ROOT_ADMIN}

linkedstore:
  brand:
    display-name: ${LINKEDSTORE_BRAND_DISPLAY_NAME:Linked-Store}
    contact-sales-to: ${MAIL_CONTACT_SALES_TO:info@vicinity24.com}
  auth:
    jwt-secret: ${LINKEDSTORE_AUTH_JWT_SECRET:linked-store-dev-super-secret-key-please-change-in-production-64chars-Minimum!!OK}
    access-token-minutes: ${LINKEDSTORE_AUTH_ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${LINKEDSTORE_AUTH_REFRESH_TOKEN_DAYS:7}
    issuer: ${LINKEDSTORE_AUTH_ISSUER:linked-store}
    default-admin-email: ${LINKEDSTORE_AUTH_DEFAULT_ADMIN_EMAIL:admin@linked.store}
    default-admin-password: ${LINKEDSTORE_AUTH_DEFAULT_ADMIN_PASSWORD:Admin123!}
    api-base-origin: ${API_BASE_ORIGIN:http://localhost:4200}
  geocoding:
    locationiq:
      api-key: ${LOCATION_IQ_API_KEY:}
      base-url: ${LOCATION_IQ_BASE_URL:https://us1.locationiq.com}
      countrycodes: ${LOCATION_IQ_COUNTRYCODES:pt,de,fr,be}
      timeout-ms: ${LOCATION_IQ_TIMEOUT_MS:8000}
  products:
    upload:
      frontend-source: ${LINKEDSTORE_PRODUCTS_UPLOAD_FRONTEND_SOURCE:}
      public-base-url: ${LINKEDSTORE_PRODUCTS_UPLOAD_PUBLIC_BASE_URL:}
